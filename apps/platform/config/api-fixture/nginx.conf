server {
  listen 8080;
  server_name _;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"genio-one-api-fixture"}';
  }

  location = /headers {
    default_type application/json;
    return 200 '{"enterprise_header":"$http_x_enterprise_business_unit","config_revision":"$http_x_enterprise_config_revision"}';
  }

  location = /validate {
    default_type application/json;
    add_header X-GenioOne-Upstream api-fixture always;
    return 202 '{"accepted":true,"service":"genio-one-api-fixture"}';
  }

  location / {
    default_type application/json;
    add_header X-GenioOne-Upstream api-fixture always;
    return 200 '{"service":"genio-one-api-fixture","resource":"traditional-api","status":"ok"}';
  }
}
