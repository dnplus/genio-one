global:
  storageClass: ""
  # Applied to every product Pod template. Configure this for a private product registry.
  imagePullSecrets: []
  publicOrigin: "https://one.example.com"
  keycloakPublicOrigin: "https://identity.one.example.com"
  botPublicOrigin: ""
  allowInsecureOidcHttp: false

tenant:
  bootstrapPeople: []
  bootstrapPeopleSecret: ""
  id: tenant-default
  administratorSubjectId: person-platform-admin
  administratorExternalSubjectId: "f912ed99-2c04-475f-8e21-ccb949ad1994"
  administratorDisplayName: GenioOne Administrator
  administratorEmail: admin@genio.internal
  administratorUsername: admin

images:
