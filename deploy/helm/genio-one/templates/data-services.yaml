{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genio-one.fullname" . }}-postgres
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "genio-one.fullname" . }}-postgres
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "genio-one.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/component: postgres, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: genio-one }
    spec:
      {{- include "genio-one.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: initialize-volume-ownership
          image: {{ .Values.images.postgres }}
          command: [sh, -c, "chown -R 70:70 /var/lib/postgresql/data /var/run/postgresql && chmod 0700 /var/lib/postgresql/data /var/run/postgresql"]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "genio-one.secretName" . }}, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, periodSeconds: 5, failureThreshold: 12 }
          livenessProbe: { exec: { command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes: [{ name: run, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "genio-one.storageClass" . | nindent 8 }}
        resources: { requests: { storage: {{ .Values.postgresql.storage }} } }
{{- end }}
{{- if .Values.valkey.enabled }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "genio-one.fullname" . }}-valkey, labels: { app.kubernetes.io/part-of: genio-one } }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/component: valkey, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: valkey, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ include "genio-one.fullname" . }}-valkey, labels: { app.kubernetes.io/part-of: genio-one } }
spec:
  serviceName: {{ include "genio-one.fullname" . }}-valkey
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: valkey, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/component: valkey, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: genio-one } }
    spec:
      {{- include "genio-one.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: valkey
          image: {{ .Values.images.valkey }}
          args: [valkey-server, --appendonly, "yes", --appendfsync, everysec, --requirepass, $(VALKEY_PASSWORD)]
          env:
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "genio-one.secretName" . }}, key: valkey-password } }
          ports: [{ name: valkey, containerPort: 6379 }]
          readinessProbe: { exec: { command: [sh, -c, 'valkey-cli -a "$VALKEY_PASSWORD" ping'] }, periodSeconds: 5 }
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "genio-one.storageClass" . | nindent 8 }}
        resources: { requests: { storage: {{ .Values.valkey.storage }} } }
{{- end }}
{{- if .Values.analytics.enabled }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "genio-one.fullname" . }}-clickhouse, labels: { app.kubernetes.io/part-of: genio-one } }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/component: clickhouse, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8123 }, { name: native, port: 9000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ include "genio-one.fullname" . }}-clickhouse, labels: { app.kubernetes.io/part-of: genio-one } }
spec:
  serviceName: {{ include "genio-one.fullname" . }}-clickhouse
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: clickhouse, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/component: clickhouse, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: genio-one } }
    spec:
      {{- include "genio-one.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: clickhouse
          image: {{ .Values.images.clickhouse }}
          ports: [{ name: http, containerPort: 8123 }, { name: native, containerPort: 9000 }]
          env:
            - { name: CLICKHOUSE_DB, value: {{ .Values.analytics.database | quote }} }
            - { name: CLICKHOUSE_USER, value: {{ .Values.analytics.username | quote }} }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "genio-one.secretName" . }}, key: clickhouse-password } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          readinessProbe: { httpGet: { path: /ping, port: http }, periodSeconds: 5, failureThreshold: 20 }
          resources: {{- toYaml .Values.analytics.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/clickhouse }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "genio-one.storageClass" . | nindent 8 }}
        resources: { requests: { storage: {{ .Values.analytics.storage }} } }
{{- end }}
