{{- if and .Values.runtimeReport.generatedKeyId .Values.secrets.existingSecret (not .Values.runtimeReport.existingSecret) }}
{{- fail "runtimeReport.generatedKeyId requires the chart-managed product Secret or runtimeReport.existingSecret" }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- if lt (len .Values.secrets.authorizationReceiptKey) 32 }}
{{- fail "secrets.authorizationReceiptKey must contain at least 32 characters" }}
{{- end }}
{{- if lt (len .Values.secrets.egressAttributionKey) 32 }}
{{- fail "secrets.egressAttributionKey must contain at least 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "genio-one.secretName" . }}
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  valkey-password: {{ required "secrets.valkeyPassword is required" .Values.secrets.valkeyPassword | quote }}
  token-vault-key: {{ required "secrets.tokenVaultKey is required" .Values.secrets.tokenVaultKey | quote }}
  mcp-oauth-encryption-key: {{ required "secrets.mcpOAuthEncryptionKey is required" .Values.secrets.mcpOAuthEncryptionKey | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgresql.username (.Values.secrets.postgresPassword | urlquery) (include "genio-one.fullname" .) .Values.postgresql.database | quote }}
  keycloak-database-password: {{ required "secrets.keycloakDatabasePassword is required" .Values.secrets.keycloakDatabasePassword | quote }}
  keycloak-admin-password: {{ required "secrets.keycloakAdminPassword is required" .Values.secrets.keycloakAdminPassword | quote }}
  tenant-administrator-password: {{ required "secrets.tenantAdministratorPassword is required" .Values.secrets.tenantAdministratorPassword | quote }}
  product-api-client-secret: {{ required "secrets.productApiClientSecret is required" .Values.secrets.productApiClientSecret | quote }}
  {{- if .Values.secrets.agentSubjectServiceToken }}
  agent-subject-service-token: {{ .Values.secrets.agentSubjectServiceToken | quote }}
  {{- end }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "genio-one.secretName" .) }}
  {{- $distillationToken := .Values.secrets.distillationTriageToken }}
  {{- if and (not $distillationToken) $existingSecret $existingSecret.data (index $existingSecret.data "distillation-triage-token") }}
  {{- $distillationToken = index $existingSecret.data "distillation-triage-token" | b64dec }}
  {{- end }}
  distillation-triage-token: {{ $distillationToken | default (randAlphaNum 48) | quote }}
  projection-signing-private-key.pem: {{ required "secrets.projectionSigningPrivateKeyPem is required" .Values.secrets.projectionSigningPrivateKeyPem | quote }}
  runtime-command-signing-private-key.pem: {{ required "secrets.runtimeCommandSigningPrivateKeyPem is required" .Values.secrets.runtimeCommandSigningPrivateKeyPem | quote }}
  runtime-command-verification-keys.json: {{ required "secrets.runtimeCommandVerificationKeysJson is required" .Values.secrets.runtimeCommandVerificationKeysJson | quote }}
  policy-artifact-signing-private-key.pem: {{ required "secrets.policyArtifactSigningPrivateKeyPem is required" .Values.secrets.policyArtifactSigningPrivateKeyPem | quote }}
  release-root-signing-private-key.pem: {{ required "secrets.releaseRootSigningPrivateKeyPem is required" .Values.secrets.releaseRootSigningPrivateKeyPem | quote }}
  policy-release-root-keys.json: {{ required "secrets.releaseRootVerificationKeysJson is required" .Values.secrets.releaseRootVerificationKeysJson | quote }}
  egress-attribution-key: {{ required "secrets.egressAttributionKey is required" .Values.secrets.egressAttributionKey | quote }}
  gravitee-database-password: {{ required "secrets.graviteeDatabasePassword is required" .Values.secrets.graviteeDatabasePassword | quote }}
  gravitee-admin-password: {{ required "secrets.graviteeAdminPassword is required" .Values.secrets.graviteeAdminPassword | quote }}
  gravitee-jwt-secret: {{ required "secrets.graviteeJwtSecret is required" .Values.secrets.graviteeJwtSecret | quote }}
  clickhouse-password: {{ required "secrets.clickhousePassword is required" .Values.secrets.clickhousePassword | quote }}
  authorization-receipt-key: {{ required "secrets.authorizationReceiptKey is required" .Values.secrets.authorizationReceiptKey | quote }}
  enforcement-private-key.pem: {{ required "secrets.enforcementPrivateKeyPem is required" .Values.secrets.enforcementPrivateKeyPem | quote }}
  enforcement-verification-keys.json: {{ required "secrets.enforcementVerificationKeysJson is required" .Values.secrets.enforcementVerificationKeysJson | quote }}
  downstream-credentials.json: {{ required "secrets.downstreamCredentialsJson is required" .Values.secrets.downstreamCredentialsJson | quote }}
  {{- if and .Values.runtimeReport.generatedKeyId (not .Values.runtimeReport.existingSecret) }}
  bot-runtime-report-key-id: {{ .Values.runtimeReport.generatedKeyId | quote }}
  bot-runtime-report-private-key.pem: {{ required "secrets.botRuntimeReportPrivateKeyPem is required when runtimeReport.generatedKeyId is configured" .Values.secrets.botRuntimeReportPrivateKeyPem | quote }}
  bot-runtime-report-public-key.pem: {{ required "secrets.botRuntimeReportPublicKeyPem is required when runtimeReport.generatedKeyId is configured" .Values.secrets.botRuntimeReportPublicKeyPem | quote }}
  {{- end }}
{{- end }}
