{{- if .Values.analytics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "genio-one.fullname" . }}-otel-config
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
data:
  collector.yaml: |
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
      file_storage:
        directory: /var/lib/otelcol/storage
        create_directory: true
        fsync: true
        compaction: { on_start: true, on_rebound: true, directory: /var/lib/otelcol/compaction, cleanup_on_start: true }
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 512, spike_limit_mib: 128 }
      filter/keep_gateway_detail:
        error_mode: propagate
        trace_conditions: ['span.name != "gateway.message.detail"']
      # Detail spans live only in otel_gateway_details (24h TTL), never in the main traces table.
      filter/drop_gateway_detail:
        error_mode: propagate
        trace_conditions:
          - span.name == "gateway.message.detail"
      # The single credential-redaction point: producers export raw payloads, this processor rewrites
      # replayable credentials by value shape before anything reaches ClickHouse. Identifiers such as
      # credential_id, token_type or secret_ref are kept. JWTs keep header and claims (signature removed);
      # bearer tokens, API keys, cookies and OAuth tokens become sha256 fingerprints; passwords, client
      # secrets, PKCE verifiers, Basic credentials and private keys are removed. ⟦fp:…⟧ is an internal
      # marker that the last statement replaces with the fingerprint.
      transform/redact_credentials:
        error_mode: ignore
        trace_statements:
          - context: span
            statements: &redact_attributes
              - 'replace_all_patterns(attributes, "value", "-----BEGIN [A-Z ]*PRIVATE KEY-----(?s:.*?)-----END [A-Z ]*PRIVATE KEY-----", "[REDACTED:PRIVATE_KEY]")'
              - 'replace_all_patterns(attributes, "value", "(eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+)\\.[A-Za-z0-9_-]+", "$$1.[REDACTED:JWT_SIGNATURE]")'
              - 'replace_all_patterns(attributes, "value", "(?i)([a-z][a-z0-9+.-]*://)([^/:@\\s\"\\\\]+):[^/@\\s\"\\\\]*@", "$$1$$2:[REDACTED]@")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\"\\s*:\\s*\")(?:[^\"\\\\]|\\\\.)*(\"|$)", "$$1[REDACTED]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\\"\\s*:\\s*\\\\\")(?:[^\"\\\\]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"]))*(\\\\\"|$)", "$$1[REDACTED]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\"\\s*:\\s*\")((?:[^\"\\\\\\[⟦]|\\\\.)+)(\"|$)", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\\\\"\\s*:\\s*\\\\\")((?:[^\"\\\\\\[⟦]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"\\[⟦]))+)(\\\\\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\"\\s*:\\s*)(?:-?[0-9][0-9.eE+-]*|true|false|\\[[^\\[\\]]*\\]|\\{[^{}]*\\})", "$$1\"[REDACTED]\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\\"\\s*:\\s*)(?:-?[0-9][0-9.eE+-]*|true|false)", "$$1\\\"[REDACTED]\\\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\"\\s*:\\s*)(-?[0-9][0-9.eE+-]*)", "$$1\"⟦fp:$$2⟧\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(<(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)(?:\\s[^>]*)?>)[^<]*(</)", "$$1[REDACTED]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(<(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)(?:\\s[^>]*)?>)([^<\\[⟦]+)(</)", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\s(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\s*=\\s*)(?:\"[^\"]*\"|\\''[^\\'']*\\'')", "$$1\"[REDACTED]\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\s(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\s*=\\s*)(?:\"([^\"\\[⟦]+)\"|\\''([^\\''\\[⟦]+)\\'')", "$$1\"⟦fp:$$2$$3⟧\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(name=\\\\?\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\?\"(?:[^\\r\\n\\\\]|\\\\[^rn])*(?:(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:[^\\r\\n\\\\]|\\\\[^rn])+)*(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:\\r?\\n|(?:\\\\r)?\\\\n))(?:[^\\r\\n\\\\]|\\\\[^rn])*", "$$1[REDACTED]")'
              - 'replace_all_patterns(attributes, "value", "(?i)(name=\\\\?\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\\\?\"(?:[^\\r\\n\\\\]|\\\\[^rn])*(?:(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:[^\\r\\n\\\\]|\\\\[^rn])+)*(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:\\r?\\n|(?:\\\\r)?\\\\n))((?:[^\\r\\n\\\\\\[⟦]|\\\\[^rn])+)", "$$1⟦fp:$$2⟧")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*(?:password|secret|credential)|[A-Za-z0-9_]*(?:private|encryption|signing)_?key|(?:code|pkce)_verifier)=[^&#\\s\"\\\\]+", "$$1$$2=[REDACTED]")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*token|api_?key|apikey|(?:proxy-)?authorization|device_code|user_code|authorization_code)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*token|api_?key|apikey|(?:proxy-)?authorization|device_code|user_code|authorization_code)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#]|^)(code|key)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#]|^)(code|key)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)(^|\"authorization\"\\s*:\\s*\"|\\\\\"authorization\\\\\"\\s*:\\s*\\\\\"|authorization:\\s*)(basic)\\s+[A-Za-z0-9+/=]+", "$$1$$2 [REDACTED:BASIC_CREDENTIAL]")'
              - 'replace_all_patterns(attributes, "value", "(?i)\\b(basic)\\s+[A-Za-z0-9+/]*(?:[0-9+/]|(?-i:[a-z][A-Z]))[A-Za-z0-9+/]*={0,2}", "$$1 [REDACTED:BASIC_CREDENTIAL]")'
              - 'replace_all_patterns(attributes, "value", "(?i)\\b(basic)\\s+(?:[A-Za-z0-9+/]{4})+(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?([^A-Za-z0-9+/=\\[⟦]|$)", "$$1 [REDACTED:BASIC_CREDENTIAL]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(^|\"authorization\"\\s*:\\s*\"|\\\\\"authorization\\\\\"\\s*:\\s*\\\\\"|authorization:\\s*)(bearer)\\s+([A-Za-z0-9._~+/=-]+)([^A-Za-z0-9._~+/=\\[-]|$)", "$$1$$2 ⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "\\b(Bearer)\\s+([A-Za-z0-9._~+/=-]{8,})([^A-Za-z0-9._~+/=\\[-]|$)", "$$1 ⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)\\b(bearer)\\s+((?:[A-Za-z0-9._~+/=-]{3,}[0-9._~+/=-][A-Za-z0-9._~+/=-]*|[A-Za-z0-9._~+/=-]*[0-9._~+/=-][A-Za-z0-9._~+/=-]{3,}))([^A-Za-z0-9._~+/=\\[-]|$)", "$$1 ⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "\\b(sk-[A-Za-z0-9_-]{16,})", "⟦fp:$$1⟧")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:proxy-)?authorization\"\\s*:\\s*\")((?:[^\"\\\\\\[⟦]|\\\\.)+)(\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:proxy-)?authorization\\\\\"\\s*:\\s*\\\\\")((?:[^\"\\\\\\[⟦]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"\\[⟦]))+)(\\\\\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "⟦fp:([^⟧]*)⟧", "$$1", SHA256, "sha256:%s")'
          - context: spanevent
            statements: *redact_attributes
          - context: resource
            statements: &redact_resource
              - 'replace_all_patterns(attributes, "value", "-----BEGIN [A-Z ]*PRIVATE KEY-----(?s:.*?)-----END [A-Z ]*PRIVATE KEY-----", "[REDACTED:PRIVATE_KEY]")'
              - 'replace_all_patterns(attributes, "value", "(eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+)\\.[A-Za-z0-9_-]+", "$$1.[REDACTED:JWT_SIGNATURE]")'
              - 'replace_all_patterns(attributes, "value", "(?i)([a-z][a-z0-9+.-]*://)([^/:@\\s\"\\\\]+):[^/@\\s\"\\\\]*@", "$$1$$2:[REDACTED]@")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\"\\s*:\\s*\")(?:[^\"\\\\]|\\\\.)*(\"|$)", "$$1[REDACTED]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\\"\\s*:\\s*\\\\\")(?:[^\"\\\\]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"]))*(\\\\\"|$)", "$$1[REDACTED]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\"\\s*:\\s*\")((?:[^\"\\\\\\[⟦]|\\\\.)+)(\"|$)", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\\\\"\\s*:\\s*\\\\\")((?:[^\"\\\\\\[⟦]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"\\[⟦]))+)(\\\\\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\"\\s*:\\s*)(?:-?[0-9][0-9.eE+-]*|true|false|\\[[^\\[\\]]*\\]|\\{[^{}]*\\})", "$$1\"[REDACTED]\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\\"\\s*:\\s*)(?:-?[0-9][0-9.eE+-]*|true|false)", "$$1\\\"[REDACTED]\\\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\"\\s*:\\s*)(-?[0-9][0-9.eE+-]*)", "$$1\"⟦fp:$$2⟧\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(<(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)(?:\\s[^>]*)?>)[^<]*(</)", "$$1[REDACTED]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(<(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)(?:\\s[^>]*)?>)([^<\\[⟦]+)(</)", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\s(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\s*=\\s*)(?:\"[^\"]*\"|\\''[^\\'']*\\'')", "$$1\"[REDACTED]\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\s(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\s*=\\s*)(?:\"([^\"\\[⟦]+)\"|\\''([^\\''\\[⟦]+)\\'')", "$$1\"⟦fp:$$2$$3⟧\"")'
              - 'replace_all_patterns(attributes, "value", "(?i)(name=\\\\?\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\?\"(?:[^\\r\\n\\\\]|\\\\[^rn])*(?:(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:[^\\r\\n\\\\]|\\\\[^rn])+)*(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:\\r?\\n|(?:\\\\r)?\\\\n))(?:[^\\r\\n\\\\]|\\\\[^rn])*", "$$1[REDACTED]")'
              - 'replace_all_patterns(attributes, "value", "(?i)(name=\\\\?\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\\\?\"(?:[^\\r\\n\\\\]|\\\\[^rn])*(?:(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:[^\\r\\n\\\\]|\\\\[^rn])+)*(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:\\r?\\n|(?:\\\\r)?\\\\n))((?:[^\\r\\n\\\\\\[⟦]|\\\\[^rn])+)", "$$1⟦fp:$$2⟧")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*(?:password|secret|credential)|[A-Za-z0-9_]*(?:private|encryption|signing)_?key|(?:code|pkce)_verifier)=[^&#\\s\"\\\\]+", "$$1$$2=[REDACTED]")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*token|api_?key|apikey|(?:proxy-)?authorization|device_code|user_code|authorization_code)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*token|api_?key|apikey|(?:proxy-)?authorization|device_code|user_code|authorization_code)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#]|^)(code|key)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)([?&#]|^)(code|key)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "(?i)(^|\"authorization\"\\s*:\\s*\"|\\\\\"authorization\\\\\"\\s*:\\s*\\\\\"|authorization:\\s*)(basic)\\s+[A-Za-z0-9+/=]+", "$$1$$2 [REDACTED:BASIC_CREDENTIAL]")'
              - 'replace_all_patterns(attributes, "value", "(?i)\\b(basic)\\s+[A-Za-z0-9+/]*(?:[0-9+/]|(?-i:[a-z][A-Z]))[A-Za-z0-9+/]*={0,2}", "$$1 [REDACTED:BASIC_CREDENTIAL]")'
              - 'replace_all_patterns(attributes, "value", "(?i)\\b(basic)\\s+(?:[A-Za-z0-9+/]{4})+(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?([^A-Za-z0-9+/=\\[⟦]|$)", "$$1 [REDACTED:BASIC_CREDENTIAL]$$2")'
              - 'replace_all_patterns(attributes, "value", "(?i)(^|\"authorization\"\\s*:\\s*\"|\\\\\"authorization\\\\\"\\s*:\\s*\\\\\"|authorization:\\s*)(bearer)\\s+([A-Za-z0-9._~+/=-]+)([^A-Za-z0-9._~+/=\\[-]|$)", "$$1$$2 ⟦fp:$$3⟧$$4")'
              - 'replace_all_patterns(attributes, "value", "\\b(Bearer)\\s+([A-Za-z0-9._~+/=-]{8,})([^A-Za-z0-9._~+/=\\[-]|$)", "$$1 ⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)\\b(bearer)\\s+((?:[A-Za-z0-9._~+/=-]{3,}[0-9._~+/=-][A-Za-z0-9._~+/=-]*|[A-Za-z0-9._~+/=-]*[0-9._~+/=-][A-Za-z0-9._~+/=-]{3,}))([^A-Za-z0-9._~+/=\\[-]|$)", "$$1 ⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "\\b(sk-[A-Za-z0-9_-]{16,})", "⟦fp:$$1⟧")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\"(?:proxy-)?authorization\"\\s*:\\s*\")((?:[^\"\\\\\\[⟦]|\\\\.)+)(\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "(?i)(\\\\\"(?:proxy-)?authorization\\\\\"\\s*:\\s*\\\\\")((?:[^\"\\\\\\[⟦]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"\\[⟦]))+)(\\\\\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_all_patterns(attributes, "value", "⟦fp:([^⟧]*)⟧", "$$1", SHA256, "sha256:%s")'
              - 'delete_matching_keys(attributes, "(?i)^(?:.*[._-])?(?:authorization|proxy-authorization|authorization_?code|cookie|set-cookie|x-api-key|[a-z0-9]*api[_-]?key|[a-z0-9]*token|[a-z0-9]*password|passwd|[a-z0-9]*secret|[a-z0-9]*credential|[a-z0-9]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)$")'
          - context: scope
            statements: *redact_resource
        metric_statements:
          - context: resource
            statements: *redact_resource
          - context: scope
            statements: *redact_resource
          - context: datapoint
            statements: *redact_attributes
        log_statements:
          - context: resource
            statements: *redact_resource
          - context: scope
            statements: *redact_resource
          - context: log
            statements: *redact_attributes
          # Structured bodies (kvlist/array) become their JSON string, which is what ClickHouse stores anyway.
          - context: log
            conditions:
              - IsMap(body) or IsList(body)
            statements:
              - set(body, String(body))
          - context: log
            conditions:
              - IsString(body)
            statements:
              - 'replace_pattern(body, "-----BEGIN [A-Z ]*PRIVATE KEY-----(?s:.*?)-----END [A-Z ]*PRIVATE KEY-----", "[REDACTED:PRIVATE_KEY]")'
              - 'replace_pattern(body, "(eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+)\\.[A-Za-z0-9_-]+", "$$1.[REDACTED:JWT_SIGNATURE]")'
              - 'replace_pattern(body, "(?i)([a-z][a-z0-9+.-]*://)([^/:@\\s\"\\\\]+):[^/@\\s\"\\\\]*@", "$$1$$2:[REDACTED]@")'
              - 'replace_pattern(body, "(?i)(\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\"\\s*:\\s*\")(?:[^\"\\\\]|\\\\.)*(\"|$)", "$$1[REDACTED]$$2")'
              - 'replace_pattern(body, "(?i)(\\\\\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\\"\\s*:\\s*\\\\\")(?:[^\"\\\\]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"]))*(\\\\\"|$)", "$$1[REDACTED]$$2")'
              - 'replace_pattern(body, "(?i)(\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\"\\s*:\\s*\")((?:[^\"\\\\\\[⟦]|\\\\.)+)(\"|$)", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "(?i)(\\\\\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\\\\"\\s*:\\s*\\\\\")((?:[^\"\\\\\\[⟦]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"\\[⟦]))+)(\\\\\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "(?i)(\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\"\\s*:\\s*)(?:-?[0-9][0-9.eE+-]*|true|false|\\[[^\\[\\]]*\\]|\\{[^{}]*\\})", "$$1\"[REDACTED]\"")'
              - 'replace_pattern(body, "(?i)(\\\\\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\\"\\s*:\\s*)(?:-?[0-9][0-9.eE+-]*|true|false)", "$$1\\\"[REDACTED]\\\"")'
              - 'replace_pattern(body, "(?i)(\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\"\\s*:\\s*)(-?[0-9][0-9.eE+-]*)", "$$1\"⟦fp:$$2⟧\"")'
              - 'replace_pattern(body, "(?i)(<(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)(?:\\s[^>]*)?>)[^<]*(</)", "$$1[REDACTED]$$2")'
              - 'replace_pattern(body, "(?i)(<(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)(?:\\s[^>]*)?>)([^<\\[⟦]+)(</)", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "(?i)(\\s(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\s*=\\s*)(?:\"[^\"]*\"|\\''[^\\'']*\\'')", "$$1\"[REDACTED]\"")'
              - 'replace_pattern(body, "(?i)(\\s(?:[A-Za-z0-9_.-]+:)?(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\s*=\\s*)(?:\"([^\"\\[⟦]+)\"|\\''([^\\''\\[⟦]+)\\'')", "$$1\"⟦fp:$$2$$3⟧\"")'
              - 'replace_pattern(body, "(?i)(name=\\\\?\"(?:[A-Za-z0-9_-]*(?:password|passwd|secret|credential)|[A-Za-z0-9_-]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)\\\\?\"(?:[^\\r\\n\\\\]|\\\\[^rn])*(?:(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:[^\\r\\n\\\\]|\\\\[^rn])+)*(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:\\r?\\n|(?:\\\\r)?\\\\n))(?:[^\\r\\n\\\\]|\\\\[^rn])*", "$$1[REDACTED]")'
              - 'replace_pattern(body, "(?i)(name=\\\\?\"(?:[A-Za-z0-9_-]*token|[A-Za-z0-9_-]*api[_-]?key|cookie|set-cookie|(?:device|user|authorization)_?code)\\\\?\"(?:[^\\r\\n\\\\]|\\\\[^rn])*(?:(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:[^\\r\\n\\\\]|\\\\[^rn])+)*(?:\\r?\\n|(?:\\\\r)?\\\\n)(?:\\r?\\n|(?:\\\\r)?\\\\n))((?:[^\\r\\n\\\\\\[⟦]|\\\\[^rn])+)", "$$1⟦fp:$$2⟧")'
              - 'replace_pattern(body, "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*(?:password|secret|credential)|[A-Za-z0-9_]*(?:private|encryption|signing)_?key|(?:code|pkce)_verifier)=[^&#\\s\"\\\\]+", "$$1$$2=[REDACTED]")'
              - 'replace_pattern(body, "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*token|api_?key|apikey|(?:proxy-)?authorization|device_code|user_code|authorization_code)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_pattern(body, "(?i)([?&#\\s\"\\'']|^)([A-Za-z0-9_]*token|api_?key|apikey|(?:proxy-)?authorization|device_code|user_code|authorization_code)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_pattern(body, "(?i)([?&#]|^)(code|key)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_pattern(body, "(?i)([?&#]|^)(code|key)=([^&#\\s\"\\\\\\[⟦]+)([&#\\s\"\\\\]|$)", "$$1$$2=⟦fp:$$3⟧$$4")'
              - 'replace_pattern(body, "(?i)(^|\"authorization\"\\s*:\\s*\"|\\\\\"authorization\\\\\"\\s*:\\s*\\\\\"|authorization:\\s*)(basic)\\s+[A-Za-z0-9+/=]+", "$$1$$2 [REDACTED:BASIC_CREDENTIAL]")'
              - 'replace_pattern(body, "(?i)\\b(basic)\\s+[A-Za-z0-9+/]*(?:[0-9+/]|(?-i:[a-z][A-Z]))[A-Za-z0-9+/]*={0,2}", "$$1 [REDACTED:BASIC_CREDENTIAL]")'
              - 'replace_pattern(body, "(?i)\\b(basic)\\s+(?:[A-Za-z0-9+/]{4})+(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?([^A-Za-z0-9+/=\\[⟦]|$)", "$$1 [REDACTED:BASIC_CREDENTIAL]$$2")'
              - 'replace_pattern(body, "(?i)(^|\"authorization\"\\s*:\\s*\"|\\\\\"authorization\\\\\"\\s*:\\s*\\\\\"|authorization:\\s*)(bearer)\\s+([A-Za-z0-9._~+/=-]+)([^A-Za-z0-9._~+/=\\[-]|$)", "$$1$$2 ⟦fp:$$3⟧$$4")'
              - 'replace_pattern(body, "\\b(Bearer)\\s+([A-Za-z0-9._~+/=-]{8,})([^A-Za-z0-9._~+/=\\[-]|$)", "$$1 ⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "(?i)\\b(bearer)\\s+((?:[A-Za-z0-9._~+/=-]{3,}[0-9._~+/=-][A-Za-z0-9._~+/=-]*|[A-Za-z0-9._~+/=-]*[0-9._~+/=-][A-Za-z0-9._~+/=-]{3,}))([^A-Za-z0-9._~+/=\\[-]|$)", "$$1 ⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "\\b(sk-[A-Za-z0-9_-]{16,})", "⟦fp:$$1⟧")'
              - 'replace_pattern(body, "(?i)(\"(?:proxy-)?authorization\"\\s*:\\s*\")((?:[^\"\\\\\\[⟦]|\\\\.)+)(\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "(?i)(\\\\\"(?:proxy-)?authorization\\\\\"\\s*:\\s*\\\\\")((?:[^\"\\\\\\[⟦]|\\\\\\\\(?:\\\\\"|\\\\\\\\|[^\\\\\"\\[⟦]))+)(\\\\\")", "$$1⟦fp:$$2⟧$$3")'
              - 'replace_pattern(body, "⟦fp:([^⟧]*)⟧", "$$1", SHA256, "sha256:%s")'
      # Attributes whose key names a credential (e.g. a native producer sending authorization -> opaque
      # value) carry nothing a value-shape rule can recognise. Values already rewritten above are kept.
      # The redaction processor offers no plain sha256, so these fingerprints are sha3 (listed in
      # redaction.masked.keys) and are not comparable with the sha256: fingerprints above.
      redaction/credential_keys_remove:
        allow_all_keys: true
        blocked_key_patterns: ['(?i)^(?:.*[._-])?(?:[a-z0-9]*password|passwd|[a-z0-9]*secret|[a-z0-9]*credential|[a-z0-9]*(?:private|encryption|signing)_?key(?:_?pem)?|(?:code|pkce)_?verifier)$']
        allowed_values: ['^(?:(?:Bearer|Basic) )?(?:sha256:[0-9a-f]{64}|\[REDACTED(?::[A-Z_]+)?\])$', '^(?:Bearer )?eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.\[REDACTED:JWT_SIGNATURE\]$']
        summary: debug
      redaction/credential_keys_fingerprint:
        allow_all_keys: true
        blocked_key_patterns: ['(?i)^(?:.*[._-])?(?:authorization|proxy-authorization|authorization_?code|cookie|set-cookie|x-api-key|[a-z0-9]*api[_-]?key|[a-z0-9]*token)$']
        allowed_values: ['^(?:(?:Bearer|Basic) )?(?:sha256:[0-9a-f]{64}|\[REDACTED(?::[A-Z_]+)?\])$', '^(?:Bearer )?eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.\[REDACTED:JWT_SIGNATURE\]$']
        hash_function: sha3
        summary: debug
    exporters:
      clickhouse:
        endpoint: {{ printf "tcp://%s-clickhouse:9000?dial_timeout=10s" (include "genio-one.fullname" .) }}
        username: ${env:GENIO_ONE_CLICKHOUSE_USER}
        password: ${env:GENIO_ONE_CLICKHOUSE_PASSWORD}
        database: ${env:GENIO_ONE_CLICKHOUSE_DB}
        create_schema: true
        ttl: {{ .Values.analytics.retention.telemetry }}
        async_insert: true
        compress: lz4
        timeout: 5s
        sending_queue: { enabled: true, storage: file_storage, sizer: bytes, queue_size: 268435456, num_consumers: 4, batch: { flush_timeout: 200ms, min_size: 65536, max_size: 0, sizer: bytes } }
        retry_on_failure: { enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 2h }
      clickhouse/gateway_detail:
        endpoint: {{ printf "tcp://%s-clickhouse:9000?dial_timeout=10s" (include "genio-one.fullname" .) }}
        username: ${env:GENIO_ONE_CLICKHOUSE_USER}
        password: ${env:GENIO_ONE_CLICKHOUSE_PASSWORD}
        database: ${env:GENIO_ONE_CLICKHOUSE_DB}
        create_schema: true
        traces_table_name: otel_gateway_details
        ttl: {{ .Values.analytics.retention.messageDetail }}
        async_insert: true
        compress: lz4
        timeout: 5s
        sending_queue: { enabled: true, storage: file_storage, sizer: bytes, queue_size: 268435456, num_consumers: 4, batch: { flush_timeout: 200ms, min_size: 65536, max_size: 0, sizer: bytes } }
        retry_on_failure: { enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 2h }
    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, filter/drop_gateway_detail, transform/redact_credentials, redaction/credential_keys_remove, redaction/credential_keys_fingerprint], exporters: [clickhouse] }
        traces/gateway_detail: { receivers: [otlp], processors: [memory_limiter, filter/keep_gateway_detail, transform/redact_credentials, redaction/credential_keys_remove, redaction/credential_keys_fingerprint], exporters: [clickhouse/gateway_detail] }
        metrics: { receivers: [otlp], processors: [memory_limiter, transform/redact_credentials, redaction/credential_keys_remove, redaction/credential_keys_fingerprint], exporters: [clickhouse] }
        logs: { receivers: [otlp], processors: [memory_limiter, transform/redact_credentials, redaction/credential_keys_remove, redaction/credential_keys_fingerprint], exporters: [clickhouse] }
  gravitee-reporter.yaml: |
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
      file_storage:
        directory: /var/lib/otelcol/storage
        create_directory: true
        fsync: true
        compaction: { on_start: true, on_rebound: true, directory: /var/lib/otelcol/compaction, cleanup_on_start: true }
    receivers:
      filelog:
        max_concurrent_files: 1
        max_batches: 1
        include: [/var/lib/genio-one/gravitee/*]
        storage: file_storage
        retry_on_failure: { enabled: true, max_elapsed_time: 2h }
        start_at: beginning
        include_file_name: true
        operators: [{ type: json_parser, id: gravitee-json }]
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 128, spike_limit_mib: 32 }
    exporters:
      otlphttp:
        endpoint: {{ printf "http://%s-otel-ingress:4318" (include "genio-one.fullname" .) }}
        sending_queue: { enabled: true, storage: file_storage, sizer: bytes, queue_size: 268435456, num_consumers: 4, batch: { flush_timeout: 200ms, min_size: 65536, max_size: 0, sizer: bytes } }
        retry_on_failure: { enabled: true, initial_interval: 1s, max_interval: 10s, max_elapsed_time: 2h }
    service:
      extensions: [health_check, file_storage]
      pipelines:
        logs: { receivers: [filelog], processors: [memory_limiter], exporters: [otlphttp] }
  ingress.yaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol/storage
        create_directory: true
        fsync: true
        compaction:
          on_start: true
          on_rebound: true
          directory: /var/lib/otelcol/compaction
          cleanup_on_start: true
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

    exporters:
      otlphttp/analytics:
        endpoint: {{ printf "http://%s-otel-collector:4318" (include "genio-one.fullname" .) }}
        retry_on_failure:
          enabled: true
          max_elapsed_time: 2h
        sending_queue:
          enabled: true
          storage: file_storage
          sizer: bytes
          queue_size: 268435456
          num_consumers: 4
          batch: { flush_timeout: 200ms, min_size: 65536, max_size: 0, sizer: bytes }

    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [otlphttp/analytics]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [otlphttp/analytics]
        logs:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [otlphttp/analytics]

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genio-one.fullname" . }}-otel-collector
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "genio-one.fullname" . }}-otel-collector
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  serviceName: {{ include "genio-one.fullname" . }}-otel-collector
  replicas: {{ .Values.analytics.collectorReplicas }}
  selector: { matchLabels: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: genio-one } }
    spec:
      {{- include "genio-one.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: wait-for-clickhouse
          image: {{ .Values.images.clickhouse }}
          command: [/bin/sh, -c]
          args:
            - {{ printf "until clickhouse-client --host %s-clickhouse --user %s --password \"$GENIO_ONE_CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1; do sleep 1; done" (include "genio-one.fullname" .) .Values.analytics.username | quote }}
          env:
            - name: GENIO_ONE_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "genio-one.secretName" . }}, key: clickhouse-password } }
          resources: { requests: { cpu: 5m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext: { runAsUser: 101, runAsGroup: 101, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: collector
          image: {{ .Values.images.otelCollector }}
          args: [--config=/etc/genio-one/collector.yaml]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          env:
            - { name: GENIO_ONE_CLICKHOUSE_DB, value: {{ .Values.analytics.database | quote }} }
            - { name: GENIO_ONE_CLICKHOUSE_USER, value: {{ .Values.analytics.username | quote }} }
            - name: GENIO_ONE_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "genio-one.secretName" . }}, key: clickhouse-password } }
          readinessProbe: { httpGet: { path: /, port: health }, periodSeconds: 5, failureThreshold: 20 }
          livenessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{- toYaml .Values.analytics.collectorResources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: config, mountPath: /etc/genio-one, readOnly: true }, { name: telemetry, mountPath: /var/lib/otelcol }]
      volumes: [{ name: config, configMap: { name: {{ include "genio-one.fullname" . }}-otel-config } }]
  volumeClaimTemplates:
    - metadata: { name: telemetry }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: 4Gi } }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ include "genio-one.fullname" . }}-otel-collector }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/component: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} } }

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genio-one.fullname" . }}-otel-ingress
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: otel-ingress, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "genio-one.fullname" . }}-otel-ingress
  labels:
    {{- include "genio-one.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-ingress
spec:
  serviceName: {{ include "genio-one.fullname" . }}-otel-ingress
  replicas: {{ .Values.analytics.collectorReplicas }}
  selector: { matchLabels: { app.kubernetes.io/component: otel-ingress, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/component: otel-ingress, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: genio-one } }
    spec:
      {{- include "genio-one.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: {{ .Values.images.otelCollector }}
          args: [--config=/etc/genio-one/ingress.yaml]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          readinessProbe: { httpGet: { path: /, port: health }, periodSeconds: 5, failureThreshold: 20 }
          livenessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{- toYaml .Values.analytics.collectorResources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: config, mountPath: /etc/genio-one, readOnly: true }, { name: telemetry, mountPath: /var/lib/otelcol }]
      volumes: [{ name: config, configMap: { name: {{ include "genio-one.fullname" . }}-otel-config } }]
  volumeClaimTemplates:
    - metadata: { name: telemetry }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources: { requests: { storage: 4Gi } }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ include "genio-one.fullname" . }}-otel-ingress }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/component: otel-ingress, app.kubernetes.io/instance: {{ .Release.Name }} } }
{{- end }}
